      Yaw：水平发射方向，0 正北(+X) 90 正东(+Z) 180 正西(-X) 270：正南(-Z)

      Pitch：垂直发射角度，0 水平射出 90 垂直向上(+Y)

      Speed：设置玩家起飞后的飞行速度

      Delay：发射玩家前等待的刻数（ticks）

      LaunchSpeed：设置玩家起飞的速度

