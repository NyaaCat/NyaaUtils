manual:
  help:
    description: 显示帮助信息
    usage: /nu [子命令] help
  reload:
    description: 从文件重新加载配置信息，未保存的修改将丢失
    usage: /nu reload
  lp:
    description: 切换掉落物保护状态
    usage: /nu lp
  dp:
    description: 切换死亡掉落保护状态
    usage: /nu dp
  bp:
    add:
      description: 为玩家扩展背包增加行数
      usage: /nu bp add {player} <行数>
    set:
      description: 为玩家扩展背包设置行数
      usage: /nu bp set {player} <行数>
    del:
      description: 为玩家扩展背包减少行数
      usage: /nu bp del {player} <行数>
    open:
      description: 强制打开玩家的扩展背包
      usage: /nu bp open {player}
    description: 打开扩展背包
    usage: /nu bp
  launch:
    description: 将玩家发射至空中，并展开鞘翅
    usage: /nu launch <Yaw> <Pitch> <Speed> <Delay> [玩家名称]
  project:
    description: 将玩家发射至空中
    usage: /nu project <Yaw> <Pitch> <Speed> <Duration> [玩家名称]
  vote:
    description: 开始新的投票
    usage: /nu vote [投票主题] [选项1] [选项2] [选项3] [选项4]...
  el:
    description: 切换飞行燃料开关状态
    usage: /nu el 或 /nu el help
    addfuel:
      description: 将物品设置为飞行燃料
      usage: /nu el addfuel [可用次数]
    removefuel:
      description: 取消设置物品为飞行燃料
      usage: /nu el removefuel
    givefuel:
      description: 将指定的飞行燃料给予玩家
      usage: /nu el givefuel [玩家名称] [fuelID] [数量]
    help:
      description: 显示帮助信息
      usage: /nu el help
  realm:
    create:
      description: 创建领域
      usage: /nu realm create [名称] [类型] [所有者]
    remove:
      description: 移除领域
      usage: /nu realm remove [领域名称]
    info:
      description: 显示领域信息
      usage: /nu realm info
    mute:
      description: 静音领域提示
      usage: /nu realm mute
    unmute:
      description: 取消领域静音提示
      usage: /nu realm unmute
    list:
      description: 列出所有领域
      usage: /nu realm list
    setpriority:
      description: 设置领域优先级
      usage: /nu realm setpriority
    help:
      description: 显示帮助信息
      usage: /nu realm help
    description: 建立领域
    usage: /nu realm help
